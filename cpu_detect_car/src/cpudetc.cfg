; CPUDETC.CFG -- ROM link map, read by `orcalink --rom-config'.
;
; An 8 KB cartridge is mapped at $A000, so ROM = AT - $A000.
; AT= is where the code runs, ROM= its offset in the image.
;
;   MAIN    $A000  the code
;   CARHDR  $BFFA  the six-byte cartridge header the OS reads
;
; The gap between them is left undescribed: makecart fills it with $FF.

[ROM]
LOAD CPUDETC::MAIN      AT=$A000  ROM=$0000
LOAD CPUDETC::CARHDR    AT=$BFFA  ROM=$1FFA
